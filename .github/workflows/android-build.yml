name: Genzii Android CI

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "${ANDROID_HOME}/licenses" || true
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n89336d0b3d537924970c50b615e66b0fe43e9342" > "${ANDROID_HOME}/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd\n85627f443315a6b8026132f8a442750e2417fd9e" > "${ANDROID_HOME}/licenses/android-sdk-preview-license"
          echo -e "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > "${ANDROID_HOME}/licenses/google-gdk-license"
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/tools/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          if command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --licenses || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          validate-wrappers: false

      - name: Ensure Environment Configuration & Keystore
        env:
          REPO_SECRET_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 1. Ensure .env.example exists with placeholder
          if [ ! -f .env.example ]; then
            echo "GEMINI_API_KEY=PLACEHOLDER_GEMINI_API_KEY" > .env.example
          fi

          # 2. Ensure .env exists with valid fallback
          if [ ! -f .env ]; then
            if [ -n "$REPO_SECRET_GEMINI_KEY" ]; then
              echo "Using GEMINI_API_KEY from repository secrets..."
              echo "GEMINI_API_KEY=$REPO_SECRET_GEMINI_KEY" > .env
            elif [ -f .env.example ]; then
              echo "Creating .env from .env.example..."
              cp .env.example .env
            else
              echo 'GEMINI_API_KEY=PLACEHOLDER_GEMINI_API_KEY' > .env
            fi
          fi

          # 3. Ensure debug.keystore exists with fallback to keytool
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Restoring debug.keystore from base64..."
              base64 -d -i debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
            fi
            if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
              echo "Generating fresh debug.keystore..."
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          echo "Signing certificate fingerprints in debug.keystore:"
          keytool -list -v -keystore debug.keystore -storepass android | grep -E "(Alias name|Owner|SHA1:|SHA256:)" || true

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run Unit & Functional Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace --continue || true

      - name: Verify Built APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi
          echo "Generated APK: $APK_PATH"
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"
          mkdir -p APK testing
          cp -f "$APK_PATH" APK/Genzii-com-genzii-app-latest.apk
          cp -f "$APK_PATH" APK/Genzii-com-genzii-latest.apk
          cp -f "$APK_PATH" APK/app-debug.apk
          cp -f "$APK_PATH" testing/Genzii-debug.apk
          ls -lh testing/Genzii-debug.apk
          sha256sum testing/Genzii-debug.apk
          echo "Verifying APK signing certificate fingerprints..."
          keytool -list -v -keystore debug.keystore -storepass android | grep -E "(Alias name|Owner|SHA1:|SHA256:)" || true

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Genzii-Android-APK
          path: |
            testing/Genzii-debug.apk
            APK/Genzii-com-genzii-app-latest.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore
